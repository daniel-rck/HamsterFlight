# Keeps the lockfile and the actions moving; without it nothing here updates on
# its own. The shared CI workflow itself is maintained in daniel-rck/web-base.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
