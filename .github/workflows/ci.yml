name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamps the commit date into the page, and `%cs` needs the
          # commit object - a depth-1 checkout has it, but not if the action
          # ever switches to a treeless fetch. Two commits is cheap insurance.
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Runtime dependencies only. There is exactly one - pixi.js - and a
      # finding there is actually shipped to visitors. Auditing the dev chain of
      # a game with no server side would mostly block unrelated work on
      # advisories nobody can act on.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Cheapest gates first so a failure surfaces fast.
      - name: Lint and format
        run: npx biome ci .

      - name: Sim purity
        run: npm run check:purity

      - name: Atlas integrity
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # Everything above runs headless. This is the only check that opens the page,
  # and it is the only one that can see a shader failing to link or an asset
  # that 404s - both of which are invisible to a typecheck and to every unit
  # test in the suite.
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The exact bytes `verify` just checked, rather than a second build that
      # could differ.
      - uses: actions/download-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke
        run: npm run smoke

  # Only reports dependencies this pull request *adds*, so it cannot thrash on
  # pre-existing advisories the way a full audit would.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Pushes to main go live. Gated on both checks, so a red build cannot deploy,
  # and in particular so nothing ships that the browser smoke test has not seen -
  # which is the thing connecting the repository in the Cloudflare dashboard
  # cannot give you, because Workers Builds neither waits for GitHub checks nor
  # has a browser to run them in.
  #
  # Every step after the first is off unless a CLOUDFLARE_API_TOKEN repository
  # secret exists. The repository is already connected in the Cloudflare
  # dashboard, so this job existing must not by itself mean every push deploys
  # twice: setting the secret is the switch, and the README says to disconnect
  # the dashboard build when you throw it.
  #
  # The gate is a step rather than the job's `if`, because the `secrets` context
  # is not available in a job-level condition.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Is deploying from here switched on?
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "on=yes" >> "$GITHUB_OUTPUT"
          else
            echo "on=no" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN; leaving the deploy to Workers Builds." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.gate.outputs.on == 'yes'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - if: steps.gate.outputs.on == 'yes'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.on == 'yes'
        run: npm ci

      # Rebuilt rather than taken from the artifact: the stamp in the page has
      # to name the commit being deployed, and the artifact is only the same
      # bytes as long as nothing in the pipeline moved.
      - if: steps.gate.outputs.on == 'yes'
        run: npm run build

      # Wrangler straight from the lockfile rather than through a third-party
      # action, so the version that deploys is the version `npm run deploy`
      # uses locally. CLOUDFLARE_ACCOUNT_ID is only needed when the token can
      # see more than one account; wrangler reads both from the environment.
      - name: Deploy
        if: steps.gate.outputs.on == 'yes'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
