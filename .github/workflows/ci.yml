name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI gates the pull request; it does not deploy. Cloudflare Workers Builds
# deploys every push to `main` through the dashboard's Git integration, the
# same way as the other apps in this family - see SETUP.md.
jobs:
  # Lint, typecheck, test, build - shared with the other apps.
  ci:
    uses: daniel-rck/web-base/.github/workflows/web-app-ci.yml@main
    with:
      bun-version: "1.3.11"

  # What only this app checks: the simulation stays pure, the atlas and its
  # manifest agree, and the bundle stays inside its budget. Cheap, so it runs
  # alongside `ci` rather than after it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      # The scripts run on Node (it executes TypeScript directly); .nvmrc is
      # also what Workers Builds uses.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run check:purity
      - run: bun run check:assets
      - run: bun run build
      - run: bun run check:bundle

  # The only job that opens the page. It can see a shader failing to link or
  # an asset that 404s, which no unit test can, and it serves the build through
  # `wrangler dev` to check the headers and 404 semantics production will have.
  smoke:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the commit date into the page and the smoke test
          # fails on an empty stamp; two commits keeps `%cs` safe.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run smoke
      - run: bun run check:cf
